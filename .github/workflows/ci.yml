name: Backend CI

on:
  push:
    branches: [backend, main]
  pull_request:
    branches: [backend, main]

jobs:
  test:
    name: Test Django
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # Read by config/settings.py. Without these the job fell back to
      # DB_USER=mongez with an empty password against no server at all, so
      # `migrate` died before a single test could run.
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: mongez
      DB_USER: mongez
      DB_PASSWORD: ci-postgres-password-not-for-production
      DB_HOST: localhost
      DB_PORT: "5432"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mongez
          POSTGRES_PASSWORD: ci-postgres-password-not-for-production
          POSTGRES_DB: mongez
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Django config
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      # Build from the repo root so the Dockerfile (deployment/docker/backend/)
      # can COPY backend/ as the source of truth.
      - name: Build image
        run: |
          docker build -t mongez-backend:${{ github.sha }} \
            -f deployment/docker/backend/Dockerfile .

      - name: Smoke test container
        run: |
          cp backend/.env.example backend/.env
          echo "DJANGO_DEBUG=true" >> backend/.env
          echo "DJANGO_SECRET_KEY=ci-smoke-test" >> backend/.env
          docker compose -f deployment/docker/docker-compose.yml -p mongez up -d
          sleep 5
          curl --retry 5 --retry-delay 2 --fail http://localhost:8000/api/auth/login/ -X POST \
            -H "Content-Type: application/json" \
            -d '{}' || true
          docker compose -f deployment/docker/docker-compose.yml -p mongez logs web
          docker compose -f deployment/docker/docker-compose.yml -p mongez down
